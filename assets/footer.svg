<svg xmlns="http://www.w3.org/2000/svg" width="900" height="104" viewBox="0 0 900 104" role="img" aria-label="ivan@van-create - конец профиля">
<title>$ exit</title>
<defs>
<clipPath id="f"><rect width="900" height="104" rx="14"/></clipPath>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0a0a"/><stop offset="1" stop-color="#2a0707"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff1a1a" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity=".9"/><stop offset="1" stop-color="#ff1a1a" stop-opacity="0"/></linearGradient>
<pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity="0.5"/></pattern>
</defs>
<g clip-path="url(#f)">
<rect width="900" height="104" fill="url(#bg)"/>
<rect id="scan" x="0" y="-8" width="900" height="120" fill="url(#lines)" opacity=".14"/>
<rect width="900" height="2" fill="#8b0000" opacity=".7"/>
<rect class="sweep" x="0" y="0" width="200" height="2" fill="url(#beam)"/>
<text class="m" x="28.0" y="46" font-size="17" fill="#ff1a1a">$ <tspan fill="#e6e6e6">exit</tspan></text>
<rect id="cursor" x="99.4" y="34" width="8" height="17" fill="#e6e6e6"/>
<text class="m" x="28.0" y="74" font-size="11.5" fill="#8a8a8a">Спасибо, что дочитали. Контакты - выше.</text>
<text class="m" x="872.0" y="46" font-size="12.5" fill="#8a8a8a" text-anchor="end">ivan@van-create: ~/profile</text>
<text class="m" x="872.0" y="74" font-size="11" fill="#8a8a8a" text-anchor="end" opacity=".65">сделано вручную на SVG, без внешних сервисов</text>
</g>
<rect x="1" y="1" width="898" height="102" rx="14" fill="none" stroke="#ff1a1a" stroke-width="1.5" stroke-opacity=".45"/>
<style>
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes sweep{0%{transform:translateX(-200px)}100%{transform:translateX(900px)}}
@keyframes drift{0%{transform:translateY(0)}100%{transform:translateY(6px)}}
#cursor{animation:blink 1.06s steps(1,end) infinite}
.sweep{animation:sweep 5.5s cubic-bezier(.4,0,.6,1) infinite}
#scan{animation:drift .9s linear infinite}
.m{font-family:"JetBrains Mono","Fira Code",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
</svg>
