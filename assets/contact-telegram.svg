<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff1a1a" stop-opacity="0"/><stop offset="0.5" stop-color="#ff8080" stop-opacity=".9"/><stop offset="1" stop-color="#ff1a1a" stop-opacity="0"/></linearGradient>
